<!DOCTYPE html>
<meta charset="UTF-8">
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <th:block th:fragment="headerStyles">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <style>
            .navbar-brand img {
                object-fit: contain;
            }
        </style>
    </th:block>
</head>

<header th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-danger" style="position: sticky; top: 0; left: 0; right: 0; z-index: 1030;">
    <div class="container">
        <!-- 로고/웹사이트명 -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/super-admin/dashboard}">
            <img th:src="@{/images/scms-logo.png}"
                 alt="scms 로고"
                 class="me-2"
                 style="height: 30px;">
            <span class="fw-bold">푸름대학교 학생역량관리시스템 - 슈퍼관리자</span>
        </a>

        <!-- 햄버거 토글 버튼 (모바일) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- 네비게이션 메뉴 -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <!-- 사용자 정보 드롭다운 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <span sec:authentication="principal.user.name">슈퍼관리자</span>님
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/logout" onclick="return confirm('로그아웃 하시겠습니까?')">로그아웃</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</header>
<th:block th:fragment="headerScript">
    <script>
        window.logout = function() {
            if (confirm('로그아웃 하시겠습니까?')) {
                window.location.href = '/logout';
            }
        };
    </script>
</th:block>
</html>
