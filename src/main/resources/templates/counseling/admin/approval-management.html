<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{counseling/counseling_layout :: layout(~{::title}, ~{::content}, ~{::css}, ~{::scripts}, false)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 승인 관리</title>
</head>
<body>
    <th:block th:fragment="css"></th:block>

    <th:block th:fragment="content">

        <div class="page-header d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title">승인 관리</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/"><i class="fas fa-home"></i></a></li>
                    <li class="breadcrumb-item active" aria-current="page">상담관리</li>
                    <li class="breadcrumb-item active" aria-current="page">승인 관리</li>
                </ol>
            </nav>
        </div>

                <!-- 필터 및 검색 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label">상태</label>
                                <select class="form-select">
                                    <option value="">전체</option>
                                    <option value="PENDING">대기중</option>
                                    <option value="APPROVED">승인됨</option>
                                    <option value="REJECTED">거부됨</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">상담 유형</label>
                                <select class="form-select">
                                    <option value="">전체</option>
                                    <option value="CAREER">진로상담</option>
                                    <option value="ACADEMIC">학업상담</option>
                                    <option value="PSYCHOLOGICAL">심리상담</option>
                                    <option value="EMPLOYMENT">취업상담</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">상담사</label>
                                <select class="form-select" id="counselorFilter">
                                    <option value="">전체</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">기간</label>
                                <div class="input-group">
                                    <input type="date" class="form-control">
                                    <span class="input-group-text">~</span>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100">검색</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 일괄 처리 버튼 -->
                <div class="mb-3">
                    <button class="btn btn-success me-2" id="bulkApprove" disabled>전체항목 승인</button>
                    <button class="btn btn-danger" id="bulkReject">선택 항목 거부</button>
                </div>

                <!-- 예약 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">상담 예약 목록 <span class="badge bg-primary" id="totalCount">0건</span></h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <input type="checkbox" id="selectAll">
                                        </th>
                                        <th>예약번호</th>
                                        <th>학생명</th>
                                        <th>상담유형</th>
                                        <th>요청일시</th>
                                        <th>확정일시</th>
                                        <th>신청일</th>
                                        <th>상담사</th>
                                        <th>상태</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>
                                <tbody id="approvalTableBody">
                                    <tr>
                                        <td colspan="10" class="text-center">로딩 중...</td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>

                        <!-- 페이지네이션 -->
                        <nav>
                            <ul class="pagination justify-content-center">
                                <li class="page-item disabled">
                                    <a class="page-link" href="#" tabindex="-1">이전</a>
                                </li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item">
                                    <a class="page-link" href="#">다음</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>

    </th:block>

    <th:block th:fragment="scripts">
    <!-- 상담사 배정 모달 -->
    <div class="modal fade" id="assignModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담사 배정 및 승인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">상담사 선택</label>
                            <select class="form-select" id="assignCounselorSelect" required>
                                <option value="">상담사를 선택하세요</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">확정 날짜</label>
                            <input type="date" class="form-control" name="confirmedDate" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">확정 시작 시간</label>
                                <input type="time" class="form-control" name="confirmedStartTime" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">확정 종료 시간</label>
                                <input type="time" class="form-control" name="confirmedEndTime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">메모</label>
                            <textarea class="form-control" rows="3" placeholder="상담 관련 메모사항을 입력하세요"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-success">배정 및 승인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 거부 모달 -->
    <div class="modal fade" id="rejectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담 예약 거부</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i> 상담 예약을 거부하시겠습니까?
                    </div>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">거부 사유 <span class="text-danger">*</span></label>
                            <textarea class="form-control" rows="4" placeholder="거부 사유를 상세히 입력해주세요" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-danger">거부</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상세 조회 모달 -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">예약 상세 정보</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>예약번호:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>학생정보:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담유형:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>요청일시:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>확정일시:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담내용:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>신청일:</strong></div>
                        <div class="col-sm-9">-</div>
                    </div>
                    <div class="row mb-3" id="rejectReasonRow" style="display: none;">
                        <div class="col-sm-3"><strong>거부사유:</strong></div>
                        <div class="col-sm-9" id="rejectReasonText"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/counseling/admin-approval.js"></script>
    </th:block>
</body>
</html>
