<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{counseling/counseling_layout :: layout(~{::title}, ~{::content}, ~{::css}, ~{::scripts}, false)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기초 관리</title>
</head>
<body>
    <th:block th:fragment="css"></th:block>

    <th:block th:fragment="content">

        <div class="page-header d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title">기초 설정</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/"><i class="fas fa-home"></i></a></li>
                    <li class="breadcrumb-item active" aria-current="page">상담관리</li>
                    <li class="breadcrumb-item active" aria-current="page">기초 설정</li>
                </ol>
            </nav>
        </div>

                <!-- 탭 네비게이션 -->
                <ul class="nav nav-tabs mb-4" id="settingsTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categories" type="button" role="tab">
                            상담분류 관리
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="counselors-tab" data-bs-toggle="tab" data-bs-target="#counselors" type="button" role="tab">
                            상담원 관리
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="satisfaction-tab" data-bs-toggle="tab" data-bs-target="#satisfaction" type="button" role="tab">
                            만족도 문항 관리
                        </button>
                    </li>
                </ul>

                <!-- 탭 콘텐츠 -->
                <div class="tab-content" id="settingsTabContent">
                    <!-- 상담분류 관리 -->
                    <div class="tab-pane fade show active" id="categories" role="tabpanel">
                        <div class="row">
                            <!-- 심리상담 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0">심리상담</h6>
                                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#subfieldModal" data-field="PSYCHOLOGICAL">
                                            <i class="bi bi-plus"></i> 세부분류 추가
                                        </button>
                                    </div>
                                    <div class="card-body">
                                        <div class="list-group list-group-flush" id="psychologicalList">
                                            <div class="text-center p-3">로딩 중...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 진로상담 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0">진로상담</h6>
                                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#subfieldModal" data-field="CAREER">
                                            <i class="bi bi-plus"></i> 세부분류 추가
                                        </button>
                                    </div>
                                    <div class="card-body">
                                        <div class="list-group list-group-flush" id="careerList">
                                            <div class="text-center p-3">로딩 중...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 취업상담 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0">취업상담</h6>
                                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#subfieldModal" data-field="EMPLOYMENT">
                                            <i class="bi bi-plus"></i> 세부분류 추가
                                        </button>
                                    </div>
                                    <div class="card-body">
                                        <div class="list-group list-group-flush" id="employmentList">
                                            <div class="text-center p-3">로딩 중...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 학습상담 -->
                            <div class="col-md-6 mb-4">
                                <div class="card">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h6 class="mb-0">학습상담</h6>
                                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#subfieldModal" data-field="LEARNING">
                                            <i class="bi bi-plus"></i> 세부분류 추가
                                        </button>
                                    </div>
                                    <div class="card-body">
                                        <div class="list-group list-group-flush" id="learningList">
                                            <div class="text-center p-3">로딩 중...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 상담원 관리 -->
                    <div class="tab-pane fade" id="counselors" role="tabpanel">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">상담원 관리</h5>
                                <div>
                                    <select class="form-select form-select-sm d-inline-block me-2" style="width: auto;" id="counselorFieldFilter">
                                        <option value="">전체 분야</option>
                                        <option value="PSYCHOLOGICAL">심리상담</option>
                                        <option value="CAREER">진로상담</option>
                                        <option value="EMPLOYMENT">취업상담</option>
                                        <option value="LEARNING">학습상담</option>
                                    </select>
                                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#counselorModal">
                                        <i class="bi bi-plus"></i> 상담원 추가
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover" id="counselorTable">
                                        <thead>
                                            <tr>
                                                <th class="sortable" data-sort="name">이름 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="email">이메일 <i class="bi bi-arrow-down-up"></i></th>
                                                <th>전문분야</th>
                                                <th>전문영역</th>
                                                <th class="sortable" data-sort="status">활성상태 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="date">등록일 <i class="bi bi-arrow-down-up"></i></th>
                                                <th>관리</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colspan="7" class="text-center">로딩 중...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                
                                <!-- 페이지네이션 -->
                                <nav>
                                    <ul class="pagination justify-content-center">
                                        <li class="page-item disabled">
                                            <a class="page-link" href="#" tabindex="-1">이전</a>
                                        </li>
                                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                                        <li class="page-item">
                                            <a class="page-link" href="#">다음</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>

                    <!-- 만족도 문항 관리 -->
                    <div class="tab-pane fade" id="satisfaction" role="tabpanel">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">만족도 문항 관리</h5>
                                <div>
                                    <select class="form-select d-inline-block me-2" style="width: auto;" id="fieldFilter">
                                        <option value="ALL">전체 분야</option>
                                        <option value="PSYCHOLOGICAL">심리상담</option>
                                        <option value="CAREER">진로상담</option>
                                        <option value="EMPLOYMENT">취업상담</option>
                                        <option value="LEARNING">학습상담</option>
                                    </select>
                                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#questionModal">
                                        <i class="bi bi-plus"></i> 문항 추가
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="alert alert-info">
                                    <i class="bi bi-info-circle"></i> 시스템 기본 질문은 모든 분야에 공통으로 적용되며, 수정 및 삭제가 불가능합니다.
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>순서</th>
                                                <th>분야</th>
                                                <th>문항 내용</th>
                                                <th>문항 유형</th>
                                                <th>시스템 기본</th>
                                                <th>사용여부</th>
                                                <th>관리</th>
                                            </tr>
                                        </thead>
                                        <tbody id="satisfactionQuestions">
                                            <tr>
                                                <td colspan="7" class="text-center">로딩 중...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

    </th:block>

    <th:block th:fragment="scripts">
    <!-- 세부 상담분류 모달 -->
    <div class="modal fade" id="subfieldModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">세부 상담분류 등록/수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">상위 분야</label>
                            <input type="text" class="form-control" id="parentField" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">세부분류명 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">설명</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="subfieldActive" checked>
                                <label class="form-check-label" for="subfieldActive">
                                    활성화
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="saveSubfield">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상담원 모달 -->
    <div class="modal fade" id="counselorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담원 등록/수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">이름 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">이메일 <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">전문분야 <span class="text-danger">*</span></label>
                            <select class="form-select" required>
                                <option value="">선택하세요</option>
                                <option value="PSYCHOLOGICAL">심리상담</option>
                                <option value="CAREER">진로상담</option>
                                <option value="EMPLOYMENT">취업상담</option>
                                <option value="LEARNING">학습상담</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">전문영역</label>
                            <textarea class="form-control" rows="3" placeholder="상담사의 전문영역을 상세히 입력하세요"></textarea>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="counselorActive" checked>
                                <label class="form-check-label" for="counselorActive">
                                    활성 상태
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="saveCounselor">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 만족도 문항 모달 -->
    <div class="modal fade" id="questionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">만족도 문항 등록/수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">순서 <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" min="1" required>
                            </div>
                            <div class="col-md-9 mb-3">
                                <label class="form-label">문항 유형 <span class="text-danger">*</span></label>
                                <select class="form-select" id="questionType" required>
                                    <option value="">선택하세요</option>
                                    <option value="SCALE">5점 척도</option>
                                    <option value="MULTIPLE">객관식</option>
                                    <option value="TEXT">주관식</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">적용 분야 <span class="text-danger">*</span></label>
                            <select class="form-select" required>
                                <option value="">선택하세요</option>
                                <option value="ALL">전체 분야 (공통)</option>
                                <option value="PSYCHOLOGICAL">심리상담</option>
                                <option value="CAREER">진로상담</option>
                                <option value="EMPLOYMENT">취업상담</option>
                                <option value="LEARNING">학습상담</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">문항 내용 <span class="text-danger">*</span></label>
                            <textarea class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3" id="optionsSection" style="display: none;">
                            <label class="form-label">선택지 (객관식인 경우)</label>
                            <div id="optionsList">
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" placeholder="선택지 입력">
                                    <button class="btn btn-outline-danger" type="button">삭제</button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="addOption">선택지 추가</button>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="questionActive" checked>
                                <label class="form-check-label" for="questionActive">
                                    사용 여부
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="saveQuestion">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadSubFields();
            await loadCounselors();
            await loadSatisfactionQuestions();
            
            // 탭 전환 시 데이터 로드
            document.getElementById('counselors-tab').addEventListener('shown.bs.tab', function() {
                loadCounselors();
            });
            
            document.getElementById('satisfaction-tab').addEventListener('shown.bs.tab', function() {
                loadSatisfactionQuestions();
            });
        });

        async function loadSatisfactionQuestions() {
            try {
                const token = localStorage.getItem('accessToken');
                const fieldFilter = document.getElementById('fieldFilter')?.value || 'ALL';
                const url = fieldFilter && fieldFilter !== 'ALL' 
                    ? `/api/counseling/satisfaction/questions?field=${fieldFilter}`
                    : '/api/counseling/satisfaction/questions';
                
                const response = await fetch(url, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    const questions = await response.json();
                    renderSatisfactionQuestions(questions);
                } else if (response.status === 404 || response.status === 405) {
                    document.getElementById('satisfactionQuestions').innerHTML = 
                        '<tr><td colspan="7" class="text-center">등록된 문항이 없습니다.</td></tr>';
                } else {
                    document.getElementById('satisfactionQuestions').innerHTML = 
                        '<tr><td colspan="7" class="text-center">등록된 문항이 없습니다.</td></tr>';
                }
            } catch (error) {
                document.getElementById('satisfactionQuestions').innerHTML = 
                    '<tr><td colspan="7" class="text-center">등록된 문항이 없습니다.</td></tr>';
            }
        }

        function renderSatisfactionQuestions(questions) {
            const tbody = document.getElementById('satisfactionQuestions');
            if (questions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">등록된 문항이 없습니다.</td></tr>';
                return;
            }
            
            tbody.innerHTML = questions.map(q => {
                const fieldBadge = q.field === 'ALL' ? 'bg-secondary' : 
                                  q.field === 'PSYCHOLOGICAL' ? 'bg-info' :
                                  q.field === 'CAREER' ? 'bg-warning' :
                                  q.field === 'EMPLOYMENT' ? 'bg-success' : 'bg-primary';
                const fieldText = q.field === 'ALL' ? '공통' : getFieldName(q.field);
                const typeText = q.type === 'SCALE' ? '5점 척도' : 
                                q.type === 'MULTIPLE' ? '객관식' : '주관식';
                const isSystem = q.isSystemDefault;
                const buttons = isSystem ? 
                    `<button class="btn btn-sm btn-outline-secondary" disabled>수정 불가</button>
                     <button class="btn btn-sm btn-outline-secondary" disabled>삭제 불가</button>` :
                    `<button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#questionModal">수정</button>
                     <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.id})">삭제</button>`;
                
                return `
                    <tr>
                        <td>${q.order}</td>
                        <td><span class="badge ${fieldBadge}">${fieldText}</span></td>
                        <td>${q.content}</td>
                        <td>${typeText}</td>
                        <td><i class="bi bi-${isSystem ? 'check' : 'x'}-circle text-${isSystem ? 'success' : 'muted'}"></i></td>
                        <td><span class="badge bg-${q.isActive ? 'success' : 'secondary'}">${q.isActive ? '사용' : '미사용'}</span></td>
                        <td>${buttons}</td>
                    </tr>
                `;
            }).join('');
        }

        async function deleteQuestion(id) {
            if (!confirm('문항을 삭제하시겠습니까?')) return;
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/counseling/management/satisfaction-questions/${id}`, {
                    method: 'DELETE',
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    alert('삭제되었습니다.');
                    loadSatisfactionQuestions();
                } else {
                    alert('삭제에 실패했습니다.');
                }
            } catch (error) {
                console.error('삭제 실패:', error);
            }
        }

        async function loadSubFields() {
            const token = localStorage.getItem('accessToken');
            try {
                const response = await fetch('/api/counseling/subfields', {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                if (response.ok) {
                    const data = await response.json();
                    renderSubFields(data);
                } else if (response.status === 404 || response.status === 405) {
                    ['psychologicalList', 'careerList', 'employmentList', 'learningList'].forEach(id => {
                        document.getElementById(id).innerHTML = '<div class="text-center p-3">등록된 세부분류가 없습니다.</div>';
                    });
                } else {
                    ['psychologicalList', 'careerList', 'employmentList', 'learningList'].forEach(id => {
                        document.getElementById(id).innerHTML = '<div class="text-center p-3">등록된 세부분류가 없습니다.</div>';
                    });
                }
            } catch (error) {
                ['psychologicalList', 'careerList', 'employmentList', 'learningList'].forEach(id => {
                    document.getElementById(id).innerHTML = '<div class="text-center p-3">등록된 세부분류가 없습니다.</div>';
                });
            }
        }

        function renderSubFields(data) {
            const fields = ['PSYCHOLOGICAL', 'CAREER', 'EMPLOYMENT', 'LEARNING'];
            const listIds = ['psychologicalList', 'careerList', 'employmentList', 'learningList'];
            
            fields.forEach((field, index) => {
                const list = document.getElementById(listIds[index]);
                const items = data.filter(item => item.field === field);
                
                if (items.length === 0) {
                    list.innerHTML = '<div class="text-center p-3">등록된 세부분류가 없습니다.</div>';
                } else {
                    list.innerHTML = items.map(item => `
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>${item.name}</span>
                            <div>
                                <div class="form-check form-switch d-inline-block me-2">
                                    <input class="form-check-input" type="checkbox" ${item.isActive ? 'checked' : ''} 
                                           onchange="toggleSubfieldStatus(${item.id}, this.checked)">
                                </div>
                                <button class="btn btn-sm btn-outline-primary" onclick="editSubfield(${item.id})">수정</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteSubfield(${item.id})">삭제</button>
                            </div>
                        </div>
                    `).join('');
                }
            });
        }

        async function toggleSubfieldStatus(id, isActive) {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/counseling/management/categories/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({isActive})
                });
                
                if (response.ok) {
                    loadSubFields();
                } else {
                    alert('상태 변경에 실패했습니다.');
                    loadSubFields();
                }
            } catch (error) {
                console.error('상태 변경 실패:', error);
            }
        }

        function editSubfield(id) {
            alert('수정 기능은 추후 구현 예정입니다.');
        }

        async function deleteSubfield(id) {
            if (!confirm('세부분류를 삭제하시겠습니까?')) return;
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/counseling/management/categories/${id}`, {
                    method: 'DELETE',
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    alert('삭제되었습니다.');
                    loadSubFields();
                } else {
                    alert('삭제에 실패했습니다.');
                }
            } catch (error) {
                console.error('삭제 실패:', error);
            }
        }

        async function loadCounselors() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/counseling/management/counselors', {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const counselors = data.content || data;
                    renderCounselorTable(counselors);
                } else {
                    console.error('상담원 목록 로드 실패:', response.status);
                    document.querySelector('#counselorTable tbody').innerHTML = 
                        '<tr><td colspan="7" class="text-center">등록된 상담원이 없습니다.</td></tr>';
                }
            } catch (error) {
                console.error('상담원 목록 로드 실패:', error);
                document.querySelector('#counselorTable tbody').innerHTML = 
                    '<tr><td colspan="7" class="text-center text-danger">로드 중 오류가 발생했습니다.</td></tr>';
            }
        }

        function renderCounselorTable(counselors) {
            const tbody = document.querySelector('#counselorTable tbody');
            if (!tbody) return;
            
            if (counselors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">등록된 상담원이 없습니다.</td></tr>';
                return;
            }
            
            tbody.innerHTML = counselors.map(c => `
                <tr data-field="${c.counselingField}">
                    <td>${c.name}</td>
                    <td>${c.email}</td>
                    <td>${getFieldName(c.counselingField)}</td>
                    <td>${c.specialization || '-'}</td>
                    <td><span class="badge bg-${c.isActive ? 'success' : 'danger'}">${c.isActive ? '활성' : '비활성'}</span></td>
                    <td>${formatDate(c.createdAt)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editCounselor(${c.userId})">수정</button>
                        <button class="btn btn-sm btn-outline-${c.isActive ? 'warning' : 'success'}" 
                                onclick="toggleCounselorStatus(${c.userId}, ${!c.isActive})">
                            ${c.isActive ? '비활성' : '활성'}
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function editCounselor(userId) {
            alert('수정 기능은 추후 구현 예정입니다.');
        }

        async function toggleCounselorStatus(userId, isActive) {
            if (!confirm(`상담원을 ${isActive ? '활성' : '비활성'}화 하시겠습니까?`)) return;
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/counseling/management/counselors/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({isActive})
                });
                
                if (response.ok) {
                    alert('상태가 변경되었습니다.');
                    loadCounselors();
                } else {
                    alert('상태 변경에 실패했습니다.');
                }
            } catch (error) {
                console.error('상태 변경 실패:', error);
                alert('상태 변경 중 오류가 발생했습니다.');
            }
        }

        function getFieldName(field) {
            const fieldNames = {
                'PSYCHOLOGICAL': '심리상담',
                'CAREER': '진로상담',
                'EMPLOYMENT': '취업상담',
                'LEARNING': '학습상담'
            };
            return fieldNames[field] || field;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString('ko-KR');
        }

        // 세부분류 모달 열기
        document.querySelectorAll('[data-bs-target="#subfieldModal"]').forEach(button => {
            button.addEventListener('click', function() {
                const field = this.getAttribute('data-field');
                const fieldNames = {
                    'PSYCHOLOGICAL': '심리상담',
                    'CAREER': '진로상담', 
                    'EMPLOYMENT': '취업상담',
                    'LEARNING': '학습상담'
                };
                document.getElementById('parentField').value = fieldNames[field] || field;
            });
        });

        // 문항 유형 변경 시 선택지 섹션 표시/숨김
        document.getElementById('questionType').addEventListener('change', function() {
            const optionsSection = document.getElementById('optionsSection');
            if (this.value === 'MULTIPLE') {
                optionsSection.style.display = 'block';
            } else {
                optionsSection.style.display = 'none';
            }
        });

        // 선택지 추가
        document.getElementById('addOption').addEventListener('click', function() {
            const optionsList = document.getElementById('optionsList');
            const newOption = document.createElement('div');
            newOption.className = 'input-group mb-2';
            newOption.innerHTML = `
                <input type="text" class="form-control" placeholder="선택지 입력">
                <button class="btn btn-outline-danger" type="button" onclick="this.parentElement.remove()">삭제</button>
            `;
            optionsList.appendChild(newOption);
        });

        // 세부분류 저장
        let currentField = null;
        document.querySelectorAll('[data-bs-target="#subfieldModal"]').forEach(button => {
            button.addEventListener('click', function() {
                currentField = this.getAttribute('data-field');
            });
        });
        
        document.getElementById('saveSubfield').addEventListener('click', async function() {
            const modal = document.getElementById('subfieldModal');
            const name = modal.querySelectorAll('input[type="text"]')[1].value;
            const description = modal.querySelector('textarea').value;
            const isActive = modal.querySelector('#subfieldActive').checked;
            
            if (!name.trim()) {
                alert('세부봠6류명을 입력해주세요.');
                return;
            }
            
            if (!currentField) {
                alert('상위 분야를 선택해주세요.');
                return;
            }
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/counseling/subfields', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({subfieldName: name, description, field: currentField, isActive})
                });
                
                if (response.ok) {
                    alert('저장되었습니다.');
                    bootstrap.Modal.getInstance(modal).hide();
                    modal.querySelectorAll('input[type="text"]')[1].value = '';
                    modal.querySelector('textarea').value = '';
                    loadSubFields();
                } else {
                    const error = await response.json();
                    alert(error.message || '저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('저장 실패:', error);
                alert('저장 중 오류가 발생했습니다.');
            }
        });

        // 상담원 저장
        document.getElementById('saveCounselor').addEventListener('click', async function() {
            const modal = document.getElementById('counselorModal');
            const name = modal.querySelectorAll('input[type="text"]')[0].value;
            const email = modal.querySelector('input[type="email"]').value;
            const field = modal.querySelector('select').value;
            const specialization = modal.querySelector('textarea').value;
            const isActive = modal.querySelector('#counselorActive').checked;
            
            if (!name.trim() || !email.trim() || !field) {
                alert('필수 항목을 모두 입력해주세요.');
                return;
            }
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/counseling/management/counselors', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({name, email, counselingField: field, specialization, isActive})
                });
                
                if (response.ok) {
                    alert('저장되었습니다.');
                    bootstrap.Modal.getInstance(modal).hide();
                    loadCounselors();
                } else {
                    const error = await response.json();
                    alert(error.message || '저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('저장 실패:', error);
                alert('저장 중 오류가 발생했습니다.');
            }
        });

        // 만족도 문항 저장
        document.getElementById('saveQuestion').addEventListener('click', async function() {
            const modal = document.getElementById('questionModal');
            const order = modal.querySelector('input[type="number"]').value;
            const type = modal.querySelector('#questionType').value;
            const field = modal.querySelectorAll('select')[1].value;
            const content = modal.querySelector('textarea').value;
            const isActive = modal.querySelector('#questionActive').checked;
            
            if (!order || !type || !field || !content.trim()) {
                alert('필수 항목을 모두 입력해주세요.');
                return;
            }
            
            const options = [];
            if (type === 'MULTIPLE') {
                const optionInputs = modal.querySelectorAll('#optionsList input');
                optionInputs.forEach(input => {
                    if (input.value.trim()) {
                        options.push(input.value.trim());
                    }
                });
                
                if (options.length === 0) {
                    alert('객관식 문항은 최소 1개 이상의 선택지가 필요합니다.');
                    return;
                }
            }
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/counseling/management/questions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({order: parseInt(order), type, field, content, options, isActive})
                });
                
                if (response.ok) {
                    alert('저장되었습니다.');
                    bootstrap.Modal.getInstance(modal).hide();
                    loadSatisfactionQuestions();
                } else {
                    const error = await response.json();
                    alert(error.message || '저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('저장 실패:', error);
                alert('저장 중 오류가 발생했습니다.');
            }
        });

        // 만족도 문항 필터링
        document.getElementById('fieldFilter').addEventListener('change', function() {
            loadSatisfactionQuestions();
        });

        // URL 해시에 따른 탭 활성화
        function activateTabFromHash() {
            if (window.location.hash) {
                const hash = window.location.hash.substring(1);
                const tabButton = document.getElementById(hash + '-tab');
                if (tabButton) {
                    const tab = new bootstrap.Tab(tabButton);
                    tab.show();
                }
            }
        }
        
        // 페이지 로드 시 탭 활성화
        activateTabFromHash();
        
        // 해시 변경 시 탭 활성화
        window.addEventListener('hashchange', activateTabFromHash);

        // window 객체에 함수 등록
        window.deleteQuestion = deleteQuestion;
        window.toggleSubfieldStatus = toggleSubfieldStatus;
        window.editSubfield = editSubfield;
        window.deleteSubfield = deleteSubfield;
        window.editCounselor = editCounselor;
        window.toggleCounselorStatus = toggleCounselorStatus;

        // 상담원 필터링
        document.getElementById('counselorFieldFilter').addEventListener('change', function() {
            const selectedField = this.value;
            const rows = document.querySelectorAll('#counselorTable tbody tr');
            
            rows.forEach(row => {
                if (!selectedField || row.getAttribute('data-field') === selectedField) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });

        // 상담원 테이블 정렬
        document.querySelectorAll('#counselorTable .sortable').forEach(header => {
            header.addEventListener('click', function() {
                const sortType = this.getAttribute('data-sort');
                const table = document.getElementById('counselorTable');
                const tbody = table.querySelector('tbody');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                
                const isAsc = this.classList.contains('asc');
                
                document.querySelectorAll('#counselorTable .sortable').forEach(h => {
                    h.classList.remove('asc', 'desc');
                });
                
                this.classList.add(isAsc ? 'desc' : 'asc');
                
                rows.sort((a, b) => {
                    let aVal, bVal;
                    
                    switch(sortType) {
                        case 'name':
                            aVal = a.cells[0].textContent;
                            bVal = b.cells[0].textContent;
                            break;
                        case 'email':
                            aVal = a.cells[1].textContent;
                            bVal = b.cells[1].textContent;
                            break;
                        case 'status':
                            aVal = a.cells[4].textContent;
                            bVal = b.cells[4].textContent;
                            break;
                        case 'date':
                            aVal = new Date(a.cells[5].textContent);
                            bVal = new Date(b.cells[5].textContent);
                            break;
                    }
                    
                    if (sortType === 'date') {
                        return isAsc ? bVal - aVal : aVal - bVal;
                    } else {
                        return isAsc ? bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    }
                });
                
                rows.forEach(row => tbody.appendChild(row));
            });
        });
    </script>
    </th:block>
</body>
</html>
