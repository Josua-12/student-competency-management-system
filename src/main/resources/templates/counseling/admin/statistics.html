<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{counseling/counseling_layout :: layout(~{::title}, ~{::content}, ~{::css}, ~{::scripts}, false)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 통계</title>
</head>
<body>
    <th:block th:fragment="css">
    <style>
        .sortable { cursor: pointer; }
        .sortable:hover { background-color: #f8f9fa; }
    </style>
    </th:block>

    <th:block th:fragment="content">

        <div class="page-header d-flex justify-content-between align-items-center mb-4">
            <h2 class="page-title">통계</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/"><i class="fas fa-home"></i></a></li>
                    <li class="breadcrumb-item active" aria-current="page">상담관리</li>
                    <li class="breadcrumb-item active" aria-current="page">통계</li>
                </ol>
            </nav>
        </div>

        <!-- 기간 선택 -->
        <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">조회 기간</label>
                                <div class="input-group">
                                    <input type="date" class="form-control" id="startDate">
                                    <span class="input-group-text">~</span>
                                    <input type="date" class="form-control" id="endDate">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100" id="searchBtn">조회</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 전체 현황 카드 -->
                <div class="row mb-4">
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-primary h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                            총 상담 건수</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="totalCounseling">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-chat-dots text-primary" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-success h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                            완료된 상담</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="completedCounseling">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-check-circle text-success" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-info h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                            평균 만족도</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="avgSatisfaction">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-star-fill text-info" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-warning h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                            활성 상담사</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="activeCounselors">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-people text-warning" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 차트 영역 -->
                <div class="row mb-4">
                    <!-- 상담 유형별 통계 -->
                    <div class="col-lg-6">
                        <div class="card mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">상담 유형별 통계</h6>
                            </div>
                            <div class="card-body">
                                <div id="typeChart"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 월별 상담 현황 -->
                    <div class="col-lg-6">
                        <div class="card mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">월별 상담 현황</h6>
                            </div>
                            <div class="card-body">
                                <div id="monthlyChart"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 상담사별 현황 -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                                <h6 class="m-0 font-weight-bold text-primary">상담사별 현황</h6>
                                <div>
                                    <select class="form-select form-select-sm d-inline-block" style="width: auto;" id="viewType">
                                        <option value="ALL">전체보기</option>
                                        <option value="COUNSELOR">상담사별</option>
                                        <option value="FIELD">전문분야별</option>
                                    </select>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered" id="counselorTable">
                                        <thead>
                                            <tr>
                                                <th>상담사명</th>
                                                <th>전문분야</th>
                                                <th class="sortable" data-sort="total">총 상담 건수 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="completed">완료 건수 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="cancelled">취소 건수 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="rejected">거부 건수 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="satisfaction">평균 만족도 <i class="bi bi-arrow-down-up"></i></th>
                                                <th class="sortable" data-sort="response">만족도 응답률 <i class="bi bi-arrow-down-up"></i></th>
                                            </tr>
                                        </thead>
                                        <tbody id="counselorTableBody">
                                            <tr>
                                                <td colspan="8" class="text-center">로딩 중...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                
                                <!-- 페이지네이션 -->
                                <nav>
                                    <ul class="pagination justify-content-center">
                                        <li class="page-item disabled">
                                            <a class="page-link" href="#" tabindex="-1">이전</a>
                                        </li>
                                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                                        <li class="page-item">
                                            <a class="page-link" href="#">다음</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 만족도 상세 통계 -->
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">상담 만족도 분포</h6>
                            </div>
                            <div class="card-body">
                                <div id="satisfactionChart"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">상담 상태별 현황</h6>
                            </div>
                            <div class="card-body">
                                <div id="statusChart"></div>
                            </div>
                        </div>
                    </div>
                </div>

    </th:block>

    <th:block th:fragment="scripts">
    <script th:src="@{/js/counseling/admin-statistics.js}"></script>
    <link rel="stylesheet" href="https://uicdn.toast.com/chart/latest/toastui-chart.min.css">
    <script src="https://uicdn.toast.com/chart/latest/toastui-chart.min.js"></script>
    <script>
        let typeChart, monthlyChart, satisfactionChart, statusChart;

        // 테이블 정렬 기능
        document.querySelectorAll('.sortable').forEach(header => {
            header.addEventListener('click', function() {
                const sortType = this.getAttribute('data-sort');
                const table = document.getElementById('counselorTable');
                const tbody = table.querySelector('tbody');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                
                const isAsc = this.classList.contains('asc');
                
                // 모든 헤더에서 정렬 클래스 제거
                document.querySelectorAll('.sortable').forEach(h => {
                    h.classList.remove('asc', 'desc');
                });
                
                // 현재 헤더에 정렬 클래스 추가
                this.classList.add(isAsc ? 'desc' : 'asc');
                
                rows.sort((a, b) => {
                    let aVal, bVal;
                    
                    switch(sortType) {
                        case 'total':
                            aVal = parseInt(a.cells[2].textContent);
                            bVal = parseInt(b.cells[2].textContent);
                            break;
                        case 'completed':
                            aVal = parseInt(a.cells[3].textContent);
                            bVal = parseInt(b.cells[3].textContent);
                            break;
                        case 'cancelled':
                            aVal = parseInt(a.cells[4].textContent);
                            bVal = parseInt(b.cells[4].textContent);
                            break;
                        case 'rejected':
                            aVal = parseInt(a.cells[5].textContent);
                            bVal = parseInt(b.cells[5].textContent);
                            break;
                        case 'satisfaction':
                            aVal = parseFloat(a.cells[6].textContent);
                            bVal = parseFloat(b.cells[6].textContent);
                            break;
                        case 'response':
                            aVal = parseInt(a.cells[7].textContent);
                            bVal = parseInt(b.cells[7].textContent);
                            break;
                    }
                    
                    return isAsc ? bVal - aVal : aVal - bVal;
                });
                
                // 정렬된 행들을 다시 추가
                rows.forEach(row => tbody.appendChild(row));
            });
        });
    </script>
    </th:block>
</body>
</html>
