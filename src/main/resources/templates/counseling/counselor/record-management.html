<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::title}, ~{::content}, ~{::css}, ~{::scripts})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담일지 관리</title>
    <th:block th:fragment="css"></th:block>
</head>
<body>
    <th:block th:fragment="content">
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted">
                        <span>상담사 메뉴</span>
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/counseling/counselor}">
                                <i class="bi bi-house-door"></i> 메인 대시보드
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/counseling/counselor/schedule}">
                                <i class="bi bi-calendar3"></i> 일정 관리
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/counseling/counselor/reservations}">
                                <i class="bi bi-check-circle"></i> 예약 승인
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/counseling/counselor/records}">
                                <i class="bi bi-journal-text"></i> 상담일지
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/counseling/counselor/history}">
                                <i class="bi bi-clock-history"></i> 상담 이력
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/counseling/counselor/satisfaction}">
                                <i class="bi bi-star"></i> 만족도 결과
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">상담일지 관리</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#recordModal">
                        <i class="bi bi-plus"></i> 상담일지 작성
                    </button>
                </div>

                <!-- 필터 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">상담 유형</label>
                                <select class="form-select">
                                    <option value="">전체</option>
                                    <option value="CAREER">진로상담</option>
                                    <option value="ACADEMIC">학업상담</option>
                                    <option value="PSYCHOLOGICAL">심리상담</option>
                                    <option value="EMPLOYMENT">취업상담</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">상담 기간</label>
                                <div class="input-group">
                                    <input type="date" class="form-control">
                                    <span class="input-group-text">~</span>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">학생명</label>
                                <input type="text" class="form-control" placeholder="학생명 검색">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100">검색</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 상담일지 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">상담일지 목록 <span class="badge bg-primary" id="totalCount">0건</span></h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>상담일</th>
                                        <th>학생명</th>
                                        <th>상담유형</th>
                                        <th>주요내용</th>
                                        <th>작성일</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>
                                <tbody id="recordTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center">로딩 중...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 페이지네이션 -->
                        <nav>
                            <ul class="pagination justify-content-center">
                                <li class="page-item disabled">
                                    <a class="page-link" href="#" tabindex="-1">이전</a>
                                </li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item">
                                    <a class="page-link" href="#">다음</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>
    </th:block>

    <th:block th:fragment="scripts">
    <!-- 상담일지 작성/수정 모달 -->
    <div class="modal fade" id="recordModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담일지 작성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">상담 내용 <span class="text-danger">*</span></label>
                            <textarea class="form-control" rows="6" placeholder="상담 내용을 입력하세요" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">비고</label>
                            <textarea class="form-control" rows="4" placeholder="추가 메모나 특이사항을 입력하세요"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상담일지 상세 조회 모달 -->
    <div class="modal fade" id="viewRecordModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담일지 상세 조회</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>학생명:</strong></div>
                        <div class="col-sm-9" id="viewStudentName">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담일:</strong></div>
                        <div class="col-sm-9" id="viewCounselingDate">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담 내용:</strong></div>
                        <div class="col-sm-9"><div class="border p-3 bg-light" id="viewRecordContent">-</div></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>비고:</strong></div>
                        <div class="col-sm-9"><div class="border p-3 bg-light" id="viewCounselorMemo">-</div></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/counseling/counselor-record.js}"></script>
    </th:block>
</body>
</html>
