<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{counseling/counseling_layout :: layout('상담 이력 관리', ~{::content}, ~{::css}, ~{::scripts}, false)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:fragment="css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    </th:block>
</head>
<body>
    <th:block th:fragment="content">
        <div class="main-content-wrapper">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">상담 이력 관리</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary">엑셀 다운로드</button>
                        </div>
                    </div>
                </div>

                <!-- 본인 담당 상담 현황 -->
                <div class="row mb-4">
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-primary h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                            총 상담 건수</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="totalHistory">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-chat-dots text-primary" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-success h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                            완료된 상담</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="completedHistory">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-check-circle text-success" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-info h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                            이번 달 상담</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="monthlyHistory">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-calendar-month text-info" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-warning h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                            평균 만족도</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="avgSatisfaction">-</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="bi bi-star-fill text-warning" style="font-size: 2rem;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 필터 및 검색 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label">상담 상태</label>
                                <select class="form-select">
                                    <option value="">전체</option>
                                    <option value="COMPLETED">완료</option>
                                    <option value="CANCELLED">취소</option>
                                    <option value="REJECTED">거절</option>
                                    <option value="NO_SHOW">노쇼</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">상담 유형</label>
                                <select class="form-select">
                                    <option value="">전체</option>
                                    <option value="CAREER">진로상담</option>
                                    <option value="ACADEMIC">학업상담</option>
                                    <option value="PSYCHOLOGICAL">심리상담</option>
                                    <option value="EMPLOYMENT">취업상담</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">기간</label>
                                <div class="input-group">
                                    <input type="date" class="form-control">
                                    <span class="input-group-text">~</span>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100">검색</button>
                            </div>
                        </div>
                        <div class="row g-3 mt-2">
                            <div class="col-md-3">
                                <label class="form-label">학생명/학번</label>
                                <input type="text" class="form-control" placeholder="학생명 또는 학번 검색">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 상담 이력 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">상담 이력 목록 <span class="badge bg-primary" id="totalCount">0건</span></h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>상담일</th>
                                        <th>학생명</th>
                                        <th>학과</th>
                                        <th>상담유형</th>
                                        <th>상태</th>
                                        <th>만족도</th>
                                        <th>상담일지</th>
                                        <th>관리</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center">로딩 중...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 페이지네이션 -->
                        <nav>
                            <ul class="pagination justify-content-center">
                                <li class="page-item disabled">
                                    <a class="page-link" href="#" tabindex="-1">이전</a>
                                </li>
                                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item">
                                    <a class="page-link" href="#">다음</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
        </div>
    </th:block>

    <th:block th:fragment="scripts">
    <script th:src="@{/js/counseling/counselor-history.js}"></script>
    <!-- 상담 이력 상세 조회 모달 -->
    <div class="modal fade" id="historyDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담 이력 상세 정보</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>학생명:</strong></div>
                        <div class="col-sm-9" id="detailStudentName">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담유형:</strong></div>
                        <div class="col-sm-9" id="detailField">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>세부분류:</strong></div>
                        <div class="col-sm-9" id="detailCategory">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담일시:</strong></div>
                        <div class="col-sm-9" id="detailDateTime">-</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상태:</strong></div>
                        <div class="col-sm-9"><span class="badge" id="detailStatus">-</span></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-sm-3"><strong>상담내용:</strong></div>
                        <div class="col-sm-9" id="detailContent">-</div>
                    </div>
                    <div class="row mb-3" id="detailReasonSection" style="display: none;">
                        <div class="col-sm-3"><strong id="detailReasonLabel">사유:</strong></div>
                        <div class="col-sm-9"><div class="alert alert-warning mb-0" id="detailReason">-</div></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상담일지 보기 모달 -->
    <div class="modal fade" id="viewRecordModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담일지 보기</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label"><strong>상담 내용</strong></label>
                        <div class="border p-3 bg-light" id="viewRecordContent">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>비고</strong></label>
                        <div class="border p-3 bg-light" id="viewRecordMemo">-</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 상담일지 작성 모달 -->
    <div class="modal fade" id="recordModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">상담일지 작성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">상담 내용 <span class="text-danger">*</span></label>
                            <textarea class="form-control" rows="6" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">비고</label>
                            <textarea class="form-control" rows="4"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</body>
</html>
