<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{counseling/counseling_layout :: layout('상담사 메인', ~{::content}, ~{::css}, ~{::scripts}, false)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:fragment="css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    </th:block>
</head>
<body>
    <th:block th:fragment="content">
        <div class="main-content-wrapper">
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2">상담사 대시보드</h1>
                    </div>

                    <!-- 통계 카드 -->
                    <div class="row mb-4">
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-primary h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                                대기중인 예약</div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="pendingReservations">-</div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="bi bi-clock text-primary" style="font-size: 2rem;"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-success h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                                오늘 상담</div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="todayCounseling">-</div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="bi bi-calendar-check text-success" style="font-size: 2rem;"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-info h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                                이번 달 상담</div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="monthlyCounseling">-</div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="bi bi-bar-chart text-info" style="font-size: 2rem;"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card border-left-warning h-100 py-2">
                                <div class="card-body">
                                    <div class="row no-gutters align-items-center">
                                        <div class="col mr-2">
                                            <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                                평균 만족도</div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="avgSatisfaction">-</div>
                                        </div>
                                        <div class="col-auto">
                                            <i class="bi bi-star-fill text-warning" style="font-size: 2rem;"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 일별 일정 -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card mb-4">
                                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                                    <h6 class="m-0 font-weight-bold text-primary">상담 일정</h6>
                                    <div class="d-flex align-items-center">
                                        <button class="btn btn-sm btn-outline-primary me-2" id="prevDay">
                                            <i class="bi bi-chevron-left"></i>
                                        </button>
                                        <span class="mx-3" id="currentDate">2024년 1월 15일 (월)</span>
                                        <button class="btn btn-sm btn-outline-primary ms-2" id="nextDay">
                                            <i class="bi bi-chevron-right"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="table table-bordered">
                                            <thead>
                                                <tr>
                                                    <th>시간</th>
                                                    <th>학생</th>
                                                    <th>상담 유형</th>
                                                    <th>상태</th>
                                                    <th>관리</th>
                                                </tr>
                                            </thead>
                                            <tbody id="scheduleTableBody">
                                                <tr>
                                                    <td colspan="5" class="text-center">로딩 중...</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
        </div>
    </th:block>
    <th:block th:fragment="scripts">
        <script th:src="@{/js/counseling/counselor-main.js}"></script>
        
        <!-- 일정 상세 보기 모달 -->
        <div class="modal fade" id="scheduleDetailModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">상담 일정 상세 정보</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col-sm-3"><strong>학생명:</strong></div>
                            <div class="col-sm-9" id="scheduleDetailStudentName">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-3"><strong>상담유형:</strong></div>
                            <div class="col-sm-9" id="scheduleDetailField">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-3"><strong>세부분류:</strong></div>
                            <div class="col-sm-9" id="scheduleDetailCategory">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-3"><strong>상담일시:</strong></div>
                            <div class="col-sm-9" id="scheduleDetailDateTime">-</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-3"><strong>상태:</strong></div>
                            <div class="col-sm-9"><span class="badge" id="scheduleDetailStatus">-</span></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-3"><strong>상담내용:</strong></div>
                            <div class="col-sm-9" id="scheduleDetailContent">-</div>
                        </div>
                        <div class="row mb-3" id="scheduleCompleteSection" style="display: none;">
                            <div class="col-12">
                                <div class="alert alert-info">
                                    <h6><i class="bi bi-info-circle"></i> 상담 완료 처리</h6>
                                    <div class="mb-3">
                                        <label class="form-label">첨부파일 (선택사항 / 최대 10MB)</label>
                                        <input type="file" class="form-control" id="scheduleCompleteFiles" multiple accept=".pdf,.doc,.docx,.hwp,.txt">
                                        <small class="text-muted">상담 결과 자료나 참고 문서를 첨부할 수 있습니다.</small>
                                    </div>
                                    <button type="button" class="btn btn-success" id="scheduleCompleteBtn">
                                        <i class="bi bi-check-circle"></i> 상담 완료
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
