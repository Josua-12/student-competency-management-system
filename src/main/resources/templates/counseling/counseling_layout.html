<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, css, scripts, hideSidebar)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">

    <title th:text="|${title} - 학생역량관리시스템|">학생역량관리시스템</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        .main-wrapper {
            overflow: hidden;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1030;
            height: 56px;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1030;
        }
        
        .content-wrapper {
            padding: 30px;
        }
    </style>
    
    <th:block th:replace="${css}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{common/header :: header}"></div>

<div class="main-wrapper flex-grow-1 d-flex">

    <aside th:if="${hideSidebar == null or !hideSidebar}"
           th:replace="~{counseling/student/sidebar :: sidebar}" sec:authorize="hasRole('STUDENT')"></aside>
    <aside th:if="${hideSidebar == null or !hideSidebar}"
           th:replace="~{counseling/counselor/sidebar :: sidebar}" sec:authorize="hasRole('COUNSELOR')"></aside>
    <aside th:if="${hideSidebar == null or !hideSidebar}"
           th:replace="~{counseling/admin/sidebar :: sidebar}" sec:authorize="hasRole('COUNSELING_ADMIN')"></aside>

    <main class="main-content">
        <div class="content-wrapper" th:insert="${content}"></div>
    </main>

</div>

<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
