<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} ?: '비교과 프로그램'">비교과 프로그램</title>

    <!-- 공통 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/noncurricular/noncurricular.css}">
    
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 56px;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
    </style>
    
    <th:block th:replace="common/header-student :: headerStyles"></th:block>
    <th:block th:replace="common/footer-student :: footerStyles"></th:block>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- 상단 헤더 -->
<div th:replace="common/header-student :: header"></div>

<div class="main-wrapper flex-grow-1 d-flex">

    <aside th:replace="noncurricular/fix-screen/noncurricular-sidebar :: noncurricularSidebar"></aside>

    <main class="main-content">
        <div class="content-wrapper">
            <!-- 페이지 전용 본문 -->
            <div th:if="${content != null}"
                 th:replace="~{${content}}"></div>
        </div>
    </main>

</div>

<!-- 푸터 -->
<div th:replace="~{common/footer-student :: footer}"></div>

<!-- 공통 JS -->
<div th:replace="common/header-student :: headerScript"></div>
<!-- 페이지 전용 JS (fragment 없으면 무시) -->

</body>
</html>
