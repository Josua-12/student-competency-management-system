<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/admin-layout :: layout('사용자 관리', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>사용자 관리</h2>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">전체 사용자 목록</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>학번</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>권한</th>
                            <th>상태</th>
                            <th>가입일</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.userNum}">20240001</td>
                            <td>
                                <a th:href="@{/admin/user/{id}(id=${user.id})}" style="color:inherit; text-decoration:none;">
                                    <span th:text="${user.name}"></span>
                                </a>
                            </td>
                            <td th:text="${user.email}">test@example.com</td>
                            <td>
                                <span class="badge bg-primary" th:text="${user.role.description}">학생</span>
                            </td>
                            <td>
                                <span th:if="${user.locked}" class="badge bg-danger">잠금</span>
                                <span th:unless="${user.locked}" class="badge bg-success">활성</span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2024-01-01</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center">등록된 사용자가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
