<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{admin/admin-layout :: layout('슈퍼 관리자 대시보드', ~{::content})}">
<body>
<div th:fragment="content">
    <h2 class="mb-4">슈퍼 관리자 대시보드</h2>
    
    <div class="row">
        <!-- 공지사항 -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="fa fa-bullhorn"></i> 공지사항
                </div>
                <div class="card-body">
                    <ul>
                        <li th:each="notice : ${notices}">
                            <span th:text="${notice.title}">공지 제목</span>
                            <span class="text-muted small" th:text="${notice.date}">2025-11-05</span>
                        </li>
                        <li th:if="${#lists.isEmpty(notices)}">공지사항이 없습니다.</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- 학생 현황 카드 -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <i class="fa fa-chart-pie"></i> 학생 현황
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-6 col-md-4 mb-3">
                            <div>전체 사용자 수</div>
                            <div class="fs-4" th:text="${totalUsers}">0명</div>
                        </div>
                        <div class="col-6 col-md-4 mb-3">
                            <div>활성 사용자</div>
                            <div class="fs-5" th:text="${activeUsers}">0명</div>
                        </div>
                        <div class="col-6 col-md-4 mb-3">
                            <div>잠금 사용자</div>
                            <div class="fs-5" th:text="${lockedUsers}">0명</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 현황 보드: 4개 박스 -->
    <div class="row">
        <div class="col-md-8 mb-4">
            <div class="row g-3">
                <!-- 역량진단현황 -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100">
                        <div class="card-header bg-info text-white text-center">
                            <i class="fa fa-clipboard-check"></i> 역량진단
                        </div>
                        <div class="card-body text-center">
                            <div class="display-5 fw-bold" th:text="${competencyCount}">0</div>
                            <div>등록 건수</div>
                        </div>
                    </div>
                </div>
                
                <!-- 상담현황 -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-white text-center">
                            <i class="fa fa-comments"></i> 상담
                        </div>
                        <div class="card-body text-center">
                            <div class="display-5 fw-bold" th:text="${counselorCount}">0</div>
                            <div>상담사 수</div>
                        </div>
                    </div>
                </div>
                
                <!-- 시스템 상태 -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100">
                        <div class="card-header bg-success text-white text-center">
                            <i class="fa fa-server"></i> 시스템
                        </div>
                        <div class="card-body text-center">
                            <div class="display-5 fw-bold text-success">정상</div>
                            <div>운영 상태</div>
                        </div>
                    </div>
                </div>
                
                <!-- 관리자 수 -->
                <div class="col-md-6 col-lg-3">
                    <div class="card h-100">
                        <div class="card-header bg-warning text-dark text-center">
                            <i class="fa fa-user-shield"></i> 관리자
                        </div>
                        <div class="card-body text-center">
                            <div class="display-5 fw-bold">1</div>
                            <div>슈퍼 관리자</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 오늘 할 일 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <i class="fa fa-calendar-day"></i> 오늘 할 일
                </div>
                <div class="card-body">
                    <ul>
                        <li th:each="todo : ${todos}">
                            <span th:text="${todo.content}">업무 내용</span>
                        </li>
                        <li th:if="${#lists.isEmpty(todos)}">오늘 할 일이 없습니다.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
