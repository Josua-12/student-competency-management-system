<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 학생역량관리시스템'">학생역량관리시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="~{common/header-super-admin :: header}"></div>

<div class="main-wrapper flex-grow-1 d-flex">

    <main class="main-content">
        <div class="content-wrapper">
            <div th:replace="${content}">
                콘텐츠가 여기에 표시됩니다.
            </div>
        </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{admin/super-admin-sidebar :: superAdminSidebarScript}"></script>

</html>
