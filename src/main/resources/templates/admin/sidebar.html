<aside class="sidebar"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
       th:fragment="sidebar">

    <style>
        :root{
            --bg:#f9fafb;
            --fg:#111827;
            --muted:#6b7280;
            --line:#e5e7eb;
            --card:#ffffff;
            --accent:#094081;
            --accent-soft:#e3f2fd;
            --radius:12px;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 56px; /* 헤더 높이만큼 아래로 */
            width: 20vw; /* 화면의 20% */
            height: calc(100vh - 56px - 60px); /* 헤더와 푸터 높이 제외 */
            background: #ffffff;
            border-right: 1px solid var(--line);
            padding: 20px 16px;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .main-content-shifted {
            margin-left: 20vw; /* 사이드바 너비만큼 */
            min-height: calc(100vh - 56px - 60px);
            padding-top: 56px; /* 헤더 높이만큼 */
        }
        .sidebar-header{
            padding:0 8px 16px;
            border-bottom:1px solid var(--line);
            margin-bottom:16px;
        }
        .sidebar-title{font-size:18px;font-weight:700;}
        .sidebar-sub{font-size:12px;color:var(--muted);margin-top:4px;}

        .menu-section{margin-bottom:12px;}
        .menu-section-toggle{
            width:100%;display:flex;align-items:center;justify-content:space-between;
            padding:8px 10px;border:none;background:transparent;
            font-size:14px;font-weight:600;cursor:pointer;
            border-radius:var(--radius);transition:background .15s;
        }
        .menu-section-toggle:hover{background:var(--accent-soft);}
        .menu-section-toggle .caret{font-size:11px;color:var(--muted);transition:transform .15s;}
        .menu-section.open .menu-section-toggle .caret{transform:rotate(90deg);}
        .menu-list{
            list-style:none;margin-top:4px;margin-left:8px;padding-left:6px;
            border-left:1px solid var(--line);display:none;
        }
        .menu-section.open .menu-list{display:block;}

        .menu-link{
            display:block;width:100%;text-align:left;
            padding:6px 10px;font-size:13px;color:var(--muted);
            border-radius:var(--radius);border:none;background:transparent;
            cursor:pointer;transition:background .15s,color .15s;
            text-decoration: none;
        }
        .menu-link:hover{background:var(--accent-soft);color:var(--accent);}
        .menu-link.active{background:var(--accent);color:#fff;}
    </style>

    <div class="sidebar-header">
        <div class="sidebar-title">시스템 관리</div>
        <div class="sidebar-sub">System Administration</div>
    </div>

    <section class="menu-section open">
        <button class="menu-section-toggle" type="button">
            <span>대시보드</span><span class="caret">▶</span>
        </button>
        <ul class="menu-list">
            <li>
                <a class="menu-link" th:href="@{/admin/dashboard}">관리자 대시보드</a>
            </li>
        </ul>
    </section>

    <section class="menu-section">
        <button class="menu-section-toggle" type="button">
            <span>사용자 관리</span><span class="caret">▶</span>
        </button>
        <ul class="menu-list">
            <li>
                <a class="menu-link" th:href="@{/admin/users}">사용자 목록</a>
            </li>
        </ul>
    </section>

    <section class="menu-section">
        <button class="menu-section-toggle" type="button">
            <span>모듈 관리</span><span class="caret">▶</span>
        </button>
        <ul class="menu-list">
            <li>
                <a class="menu-link" th:href="@{/competency/admin/dashboard}">역량진단 관리</a>
            </li>
            <li>
                <a class="menu-link" th:href="@{/counseling/admin/dashboard}">상담 관리</a>
            </li>
            <li>
                <a class="menu-link" th:href="@{/noncurricular/admin/dashboard}">비교과 관리</a>
            </li>
        </ul>
    </section>

    <script th:fragment="adminSidebarScript">
        document.querySelectorAll('.menu-section-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const section = btn.closest('.menu-section');
                section.classList.toggle('open');
            });
        });

        document.querySelectorAll('.menu-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.menu-link')
                    .forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        (function setActiveByLocation() {
            const current = window.location.pathname;
            const links = document.querySelectorAll('.menu-link');
            let matched = null;

            links.forEach(l => {
                const href = l.getAttribute('href');
                if (!href) return;

                const path = href.startsWith('http')
                    ? new URL(href, window.location.origin).pathname
                    : href;

                if (current.startsWith(path)) {
                    if (!matched || path.length > (matched.getAttribute('href') || '').length) {
                        matched = l;
                    }
                }
            });

            if (matched) {
                matched.classList.add('active');
                const section = matched.closest('.menu-section');
                if (section) section.classList.add('open');
            }
        })();
    </script>
</aside>
