<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{mypage/mypage-layout :: layout(~{::title}, ~{::content}, ~{::css}, ~{::scripts})}">
<head>
    <title>비밀번호 변경</title>
    <th:block th:fragment="css">
        <link rel="stylesheet" th:href="@{/css/mypage/changePW.css}">
    </th:block>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">비밀번호 변경</h1>
        </div>

        <div class="password-form">
            <div id="alertMessage" class="alert d-none" role="alert"></div>

            <form id="passwordChangeForm">
                <!-- 현재 비밀번호 -->
                <div class="mb-3">
                    <label for="currentPassword" class="form-label fw-semibold">
                        <i class="fas fa-lock me-2"></i>현재 비밀번호 <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                    <div class="invalid-feedback">현재 비밀번호를 입력해주세요.</div>
                </div>

                <!-- 새 비밀번호 -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold">
                        <i class="fas fa-key me-2"></i>새 비밀번호 <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required 
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                           title="비밀번호는 8자 이상, 대소문자, 숫자를 포함해야 합니다.">
                    <div class="form-text">8자 이상, 대문자, 소문자, 숫자를 포함해야 합니다.</div>
                    <div class="invalid-feedback">비밀번호는 8자 이상, 대문자, 소문자, 숫자를 포함해야 합니다.</div>
                </div>

                <!-- 새 비밀번호 확인 -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">
                        <i class="fas fa-redo me-2"></i>새 비밀번호 확인 <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                    <div class="invalid-feedback" id="confirmPasswordFeedback">비밀번호가 일치하지 않습니다.</div>
                </div>

                <!-- 변경 버튼 -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold" id="changeButton">
                        <span id="buttonText">비밀번호 변경</span>
                        <span id="spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script th:src="@{/js/mypage/changePW.js}"></script>
    </th:block>
</body>
</html>
