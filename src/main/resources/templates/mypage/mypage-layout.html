<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, css, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${title} - 마이페이지|">마이페이지</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 56px;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .main-content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
    </style>
    <th:block th:replace="${css}"></th:block>
</head>
<body>
    <div th:replace="~{common/header :: header}"></div>
    
    <div class="main-wrapper flex-grow-1 d-flex">
        <aside th:replace="~{mypage/sidebar :: sidebar}"></aside>
        
        <main class="main-content">
            <div class="content-wrapper" th:insert="${content}"></div>
        </main>
    </div>
    
    <div th:replace="~{common/footer :: footer}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarLinks = document.querySelectorAll('.sidebar-link');
            const mainContent = document.querySelector('.col-md-9.col-lg-10');
            
            sidebarLinks.forEach(link => {
                link.addEventListener('click', async function(e) {
                    e.preventDefault();
                    const url = this.dataset.url;
                    
                    // 활성 링크 스타일 변경
                    sidebarLinks.forEach(l => l.classList.remove('bg-primary', 'text-white'));
                    this.classList.add('bg-primary', 'text-white');
                    
                    try {
                        const response = await fetch(url);
                        if (response.ok) {
                            const html = await response.text();
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(html, 'text/html');
                            const newContent = doc.querySelector('main, .container, .container-fluid, body');
                            
                            if (newContent) {
                                mainContent.innerHTML = '<div class="p-4">' + newContent.innerHTML + '</div>';
                            }
                        }
                    } catch (error) {
                        console.error('페이지 로드 실패:', error);
                    }
                });
            });
        });
    </script>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>
