<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, css, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${title} - 마이페이지|">마이페이지</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-wrapper {
            flex: 1;
        }
    </style>
    <th:block th:replace="${css}"></th:block>
</head>
<body>
    <div th:replace="~{common/header :: header}"></div>
    
    <div class="main-wrapper">
        <div class="container-fluid">
            <div class="row">
                <!-- 마이페이지 사이드바 -->
                <div class="col-md-3 col-lg-2 bg-light sidebar">
                    <div class="p-4">
                        <h5 class="fw-bold mb-4">마이페이지</h5>
                        <ul class="list-unstyled">
                            <li class="mb-2">
                                <a href="/student/mypage" class="d-block p-2 text-decoration-none text-dark rounded">
                                    <i class="fas fa-chart-line me-2"></i> 대시보드
                                </a>
                            </li>
                            <li class="mb-2">
                                <a href="/student/mypage/assessment-history" class="d-block p-2 text-decoration-none text-dark rounded">
                                    <i class="fas fa-chart-bar me-2"></i> 역량 진단 현황
                                </a>
                            </li>
                            <li class="mb-2">
                                <a href="/student/mypage/application-status" class="d-block p-2 text-decoration-none text-dark rounded">
                                    <i class="fas fa-list-check me-2"></i> 프로그램 신청 현황
                                </a>
                            </li>
                            <li class="mb-2">
                                <a href="/student/mypage/info" class="d-block p-2 text-decoration-none text-dark rounded">
                                    <i class="fas fa-user-edit me-2"></i> 사용자 정보 수정
                                </a>
                            </li>
                            <li class="mb-2">
                                <a href="/student/mypage/password" class="d-block p-2 text-decoration-none text-dark rounded">
                                    <i class="fas fa-key me-2"></i> 비밀번호 변경
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                
                <!-- 메인 콘텐츠 -->
                <div class="col-md-9 col-lg-10">
                    <div class="p-4" th:replace="${content}"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{common/footer :: footer}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>
