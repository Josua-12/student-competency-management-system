<aside class="sidebar"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
       th:fragment="sidebar">

    <style>
        :root{
            --bg:#f9fafb;
            --fg:#111827;
            --muted:#6b7280;
            --line:#e5e7eb;
            --card:#ffffff;
            --accent:#094081;
            --accent-soft:#e3f2fd;
            --radius:12px;
        }
        .main-wrapper {
            display: flex;
            flex-direction: row;
            min-height: calc(100vh - 56px);
        }
        
        .sidebar {
            width: 20%;
            min-width: 250px;
            background: #ffffff;
            border-right: 1px solid var(--line);
            padding: 20px 16px;
            overflow-y: auto;
        }
        
        .main-content {
            width: 80%;
            overflow-y: auto;
            padding: 1.5rem 0;
        }
        
        .content-wrapper {
            padding: 30px 20px;
        }
        .sidebar-header{
            padding:0 8px 16px;
            border-bottom:1px solid var(--line);
            margin-bottom:16px;
        }
        .sidebar-title{font-size:18px;font-weight:700;}
        .sidebar-sub{font-size:12px;color:var(--muted);margin-top:4px;}

        .menu-section{margin-bottom:12px;}
        .menu-section-toggle{
            width:100%;display:flex;align-items:center;justify-content:space-between;
            padding:8px 10px;border:none;background:transparent;
            font-size:14px;font-weight:600;cursor:pointer;
            border-radius:var(--radius);transition:background .15s;
        }
        .menu-section-toggle:hover{background:var(--accent-soft);}
        .menu-section-toggle .caret{font-size:11px;color:var(--muted);transition:transform .15s;}
        .menu-section.open .menu-section-toggle .caret{transform:rotate(90deg);}
        .menu-list{
            list-style:none;margin-top:4px;margin-left:8px;padding-left:6px;
            border-left:1px solid var(--line);display:none;
        }
        .menu-section.open .menu-list{display:block;}

        .menu-link{
            display:block;width:100%;text-align:left;
            padding:6px 10px;font-size:13px;color:#6b7280;
            border-radius:12px;border:none;background:transparent;
            cursor:pointer;transition:background .15s,color .15s;
            text-decoration: none;
        }
        .menu-link:hover{background:#e3f2fd;color:#094081;}
        .menu-link.active{background:#094081 !important;color:#fff !important;}
    </style>

    <div class="sidebar-header">
        <div class="sidebar-title">마이페이지</div>
        <div class="sidebar-sub">My Page</div>
    </div>

    <section class="menu-section open">
        <button class="menu-section-toggle" type="button">
            <span>대시보드</span><span class="caret">▶</span>
        </button>
        <ul class="menu-list">
            <li>
                <a class="menu-link" th:href="@{/student/mypage}">개인 대시보드</a>
            </li>
        </ul>
    </section>

    <section class="menu-section">
        <button class="menu-section-toggle" type="button">
            <span>개인정보</span><span class="caret">▶</span>
        </button>
        <ul class="menu-list">
            <li>
                <a class="menu-link" th:href="@{/student/mypage/info}">개인정보 수정</a>
            </li>
            <li>
                <a class="menu-link" th:href="@{/student/mypage/password}">비밀번호 변경</a>
            </li>
        </ul>
    </section>

    <section class="menu-section" sec:authorize="hasAnyRole('ADMIN','COUNSELING_ADMIN','COMPETENCY_ADMIN','NONCURRICULAR_ADMIN')">
        <button class="menu-section-toggle" type="button">
            <span>관리</span><span class="caret">▶</span>
        </button>
        <ul class="menu-list">
            <li sec:authorize="hasRole('ADMIN')">
                <a class="menu-link" th:href="@{/mypage/user-management}">사용자 관리</a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN','COUNSELING_ADMIN','COMPETENCY_ADMIN','NONCURRICULAR_ADMIN')">
                <a class="menu-link" th:href="@{/mypage/system-settings}">시스템 설정</a>
            </li>
        </ul>
    </section>

    <script th:fragment="mypageSidebarScript">
        document.querySelectorAll('.menu-section-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const section = btn.closest('.menu-section');
                section.classList.toggle('open');
            });
        });

        document.querySelectorAll('.menu-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.menu-link')
                    .forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        (function setActiveByLocation() {
            const current = window.location.pathname;
            const links = document.querySelectorAll('.menu-link');
            let matched = null;

            links.forEach(l => {
                const href = l.getAttribute('href');
                if (!href) return;

                const path = href.startsWith('http')
                    ? new URL(href, window.location.origin).pathname
                    : href;

                if (current.startsWith(path)) {
                    if (!matched || path.length > (matched.getAttribute('href') || '').length) {
                        matched = l;
                    }
                }
            });

            if (matched) {
                matched.classList.add('active');
                const section = matched.closest('.menu-section');
                if (section) section.classList.add('open');
            }
        })();
    </script>
</aside>
