<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{mypage/mypage-layout :: layout(~{::title}, ~{::content}, ~{::css}, ~{::scripts})}">
<head>
    <title>비밀번호 변경</title>
    <th:block th:fragment="css">
    </th:block>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">비밀번호 변경</h1>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="fw-semibold mb-3">비밀번호 변경 안내</h5>
                        <ul class="list-unstyled">
                            <li class="mb-2"><i class="fas fa-check text-success me-2"></i>8자 이상 입력</li>
                            <li class="mb-2"><i class="fas fa-check text-success me-2"></i>영문, 숫자, 특수문자 포함</li>
                            <li class="mb-2"><i class="fas fa-check text-success me-2"></i>현재 비밀번호와 다르게 설정</li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <form id="passwordForm">
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">현재 비밀번호</label>
                        <input type="password" class="form-control" id="currentPassword" required>
                        <div class="text-danger small mt-1" id="current-password-error"></div>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">새 비밀번호</label>
                        <input type="password" class="form-control" id="newPassword" required>
                        <div class="text-danger small mt-1" id="new-password-error"></div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                        <div class="text-danger small mt-1" id="confirm-password-error"></div>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/student/mypage" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>돌아가기
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>변경
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:fragment="scripts">
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('passwordForm');
            
            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
                return null;
            }
            
            function getAuthHeaders() {
                const token = getCookie('accessToken');
                return token ? {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                } : {
                    'Content-Type': 'application/json'
                };
            }
            
            function clearErrors() {
                document.querySelectorAll('.text-danger').forEach(element => {
                    element.textContent = '';
                });
            }
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearErrors();
                
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                let isValid = true;
                
                if (newPassword.length < 8) {
                    document.getElementById('new-password-error').textContent = '비밀번호는 8자 이상이어야 합니다.';
                    isValid = false;
                }
                
                const passwordPattern = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':,.<>?]).+$/;
                if (!passwordPattern.test(newPassword)) {
                    document.getElementById('new-password-error').textContent = '비밀번호는 영문, 숫자, 특수문자를 포함해야 합니다.';
                    isValid = false;
                }
                
                if (newPassword !== confirmPassword) {
                    document.getElementById('confirm-password-error').textContent = '새 비밀번호가 일치하지 않습니다.';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                try {
                    const response = await fetch('/api/user/password', {
                        method: 'PATCH',
                        headers: getAuthHeaders(),
                        credentials: 'include',
                        body: JSON.stringify({
                            currentPassword: currentPassword,
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        })
                    });
                    
                    if (response.ok) {
                        alert('비밀번호가 성공적으로 변경되었습니다.');
                        form.reset();
                    } else {
                        const error = await response.json().catch(() => ({}));
                        if (error.error) {
                            if (error.error.includes('현재')) {
                                document.getElementById('current-password-error').textContent = error.error;
                            } else {
                                document.getElementById('new-password-error').textContent = error.error;
                            }
                        } else {
                            alert('비밀번호 변경 중 오류가 발생했습니다.');
                        }
                    }
                } catch (error) {
                    console.error('비밀번호 변경 실패:', error);
                    alert('비밀번호 변경 중 오류가 발생했습니다.');
                }
            });
        });
        </script>
    </th:block>
</body>
</html>
